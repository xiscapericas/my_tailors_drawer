# Test5 — improved preprocessing vs Test4 (no anatomy QC, 700 epochs)
#
# One-line rule: Test5 changes preprocessing (improved anatomical background +
# canonical organ dict; no anatomy QC) compared to test4; tumor labels, trainer,
# epochs, and Tr/Va/Ts membership stay the same as the Test1 manifesto.

experiment:
  id: test5
  name: RADHECK — improved preprocess (bg, no QC) vs Test4
  status: planned
  changed_from: test4
  hypothesis: >
    Better anatomical_region / other-tissue (FOV-aware body mask, sagittal L/R
    symmetry, Z continuity) with separate GTVp/GTVn and a canonical organ
    dictionary improves GTVp/GTVn Dice vs Test4 on the same split family,
    without discarding cases via anatomy QC.

training:
  needs_dataset_build: true
  needs_plan_preprocess: true
  reuse_preprocessed_from: null

  cohorts: [radcure, hecktor]
  dataset_id: 650
  dataset_folder: ${RADHECK_DATASET_TEST5}
  nnunet_retrain_path: ${RETRAIN_RADHECK_TEST5}
  nnunet_preprocessed_path: null

  tumor_label_mode: separate
  background_mode: improved
  anatomy_qc_threshold: null  # keep all cases

  # Original sources (read-only). Outputs under TEST5_WORK_ROOT/RADHECK_{N}/cases/
  sources:
    radcure: ${TEST5_RADCURE_SOURCE}
    hecktor_train: ${TEST5_HECKTOR_TRAIN_SOURCE}
    hecktor_test: ${TEST5_HECKTOR_TEST_SOURCE}
  unified_cohort: RADHECK_{N}/cases
  memory:
    hecktor_cleanup_intermediates: true
    dataset_link_mode: hardlink

  trainer: nnUNetTrainer_700epochs_NoMirroring
  configuration: 3d_fullres
  fold: 0
  epochs: 700
  custom_trainer_install: python -m nnunet_training.install_trainer_variants

  env:
    nnUNet_compile: "false"
    CUDA_VISIBLE_DEVICES: "1"
    NNUNET_DISABLE_TTA: "true"
    NNUNET_USE_LOCAL_PREPROCESS: "1"

evaluation:
  model_dataset_id: 650
  metrics:
    - GTVp Dice
    - GTVn Dice
  radcure:
    dataset_folder: ${RADHECK_DATASET_TEST5}
    steps:
      - predict
      - evaluation_visualization
    output_predictions: ${RADHECK_DATASET_TEST5}/labelsTs_predicted
    output_viz: ${RADHECK_DATASET_TEST5}/labelsTs_dice_and_viz
    logs: ${RETRAIN_RADHECK_TEST5}/logs
  hecktor:
    dataset_folder: ${HECKTOR_TEST_DATASET}
    eval_output_dir: ${RETRAIN_RADHECK_TEST5}/hecktor_validation
    steps:
      - predict
      - eval
    output_predictions: ${RETRAIN_RADHECK_TEST5}/hecktor_validation/labelsTs_predicted
    output_viz: ${RETRAIN_RADHECK_TEST5}/hecktor_validation/labelsTs_dice_and_viz
    logs: ${RETRAIN_RADHECK_TEST5}/hecktor_validation/logs

results:
  primary_metric: GTVp Dice
  secondary_metrics:
    - GTVn Dice
  radcure:
    mean_dice_gtvp: null
    mean_dice_gtvn: null
    n_cases: null
  hecktor:
    mean_dice_gtvp: null
    mean_dice_gtvn: null
    n_cases: null
  notes: "From scratch — see pipelines/radheck/Retrain-Radheck-Test5.md"
