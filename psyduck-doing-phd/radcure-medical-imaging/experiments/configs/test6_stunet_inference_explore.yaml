# Test6 — STU-Net inference explore (HISTORICAL — research / inference-only)
#
# Superseded for training by: configs/test6_radheck_stunet_finetune.yaml
# Keep this file as the record of the Colab explore chapter.
#
# One-line rule (explore): Test6 explored STU-Net pretrained inference vs our
# RADHECK nnUNet pipeline; pretrained model has no GTVp/GTVn.

experiment:
  id: test6
  name: STU-Net inference explore (research)
  status: explored
  changed_from: test5
  hypothesis: >
    A large STU-Net pretrained on TotalSegmentator may provide stronger organ
    priors for H&N CT than our current TS → nnUNet stack. First check organ
    quality via direct inference on Test5-preprocessed AWS cases; tumor
    (GTVp/GTVn) requires later fine-tuning.

training:
  needs_dataset_build: false
  needs_plan_preprocess: false
  reuse_preprocessed_from: null
  note: research notebook only — inference explore complete; not training yet

  cohorts: [radcure, hecktor]
  model: STU-Net-S  # then B / L / H after synonym map / if warranted
  pretrained_on: TotalSegmentator (104 classes)
  tumor_label_mode: n/a  # pretrained STU-Net has no GTVp/GTVn

  preprocess:
    source: aws_download
    pipeline: test5  # separate GTVp/GTVn, improved bg, anatomy_qc=0.50, canonical dict
    via: CaseProcessor

  research_notebook: research_notebooks/test6_stunet/test6_stunet_inference_explore.ipynb
  work_root: ${TEST6_WORK_ROOT}

evaluation:
  metrics:
    - organ Dice (name-matched vs our GT labels from Test5 preprocess)
    - qualitative viz (CT / STU organs / GT+tumor; best-z slice)
  tumor_dice: deferred_until_finetune

results:
  primary_metric: matched_organ_Dice
  first_run:
    date: 2026-08-01
    model: STU-Net-S
    cases: [RADCURE-0122, RADCURE-0040, HMR-012, CHUM-023]
    name_matches: 0
    matched_organ_dice: nan
    tumor_dice: n/a
    note: >
      Few STU labels on H&N FOV (~0–3/case). Naive string match insufficient.
      Colab pitfalls documented in research_notebooks/test6_stunet/README.md.
  notes: >
    Explore chapter closed. Resume after Test5 with (1) synonym map
    STU↔H&N then (2) fine-tune for GTVp/GTVn vs Test4/Test5.
