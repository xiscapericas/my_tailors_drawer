# Test6 — STU-Net exploration (research / inference-only)
#
# One-line rule: Test6 explores STU-Net (TotalSegmentator-pretrained scalable
# nnU-Net) as an organ foundation model compared to our RADHECK nnUNet pipeline;
# no full Dataset650 retrain until fine-tuning is decided.

experiment:
  id: test6
  name: STU-Net inference explore (research)
  status: planned
  changed_from: test5
  hypothesis: >
    A large STU-Net pretrained on TotalSegmentator may provide stronger organ
    priors for H&N CT than our current TS → nnUNet stack. First check organ
    quality via direct inference; tumor (GTVp/GTVn) requires later fine-tuning.

training:
  needs_dataset_build: false
  needs_plan_preprocess: false
  reuse_preprocessed_from: null
  note: research notebook only — not training yet

  cohorts: [radcure, hecktor]
  model: STU-Net-S  # then B / L / H
  pretrained_on: TotalSegmentator (104 classes)
  tumor_label_mode: n/a  # pretrained STU-Net has no GTVp/GTVn

  research_notebook: research_notebooks/test6_stunet/test6_stunet_inference_explore.ipynb
  work_root: ${TEST6_WORK_ROOT}

evaluation:
  metrics:
    - organ Dice (name-matched vs our GT labels)
    - qualitative viz (CT / STU organs / GT+tumor)
  tumor_dice: deferred_until_finetune

results:
  primary_metric: matched_organ_Dice
  notes: "Research scaffold — fill after sample inference"
