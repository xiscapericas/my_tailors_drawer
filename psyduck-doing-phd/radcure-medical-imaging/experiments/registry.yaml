# RADHECK / RADCURE experiment registry
# Update this file after every completed experiment.
# Path values use placeholders — set real paths in experiments/configs/local.yaml (gitignored) or server .env.

schema_version: 1

# ---------------------------------------------------------------------------
# Pipeline (fixed unless you explicitly change preprocessing)
# ---------------------------------------------------------------------------
pipeline:
  description: |
    Two-stage head-and-neck GTVp segmentation pipeline:
    1. Preprocessing (image_processor): DICOM or NIfTI → TotalSegmentator organs →
       combined mask (head/body, background, organs, tumor/GTVp).
    2. nnUNet: train on labelsTr/Va, predict on test sets, evaluate Dice (+ Surface Dice),
       optional slice-by-slice PDFs (CT, GT, prediction per frame).
  stages:
    preprocess:
      radcure: process_all_cases.py
      hecktor: image_processor CaseProcessor + pipelines.radheck.build_nnunet_dataset
    train: train_nnunet.py
    evaluate_radcure: train_nnunet.py --step evaluate
    evaluate_hecktor: python -m pipelines.hecktor.test_pipeline --predict-only | --eval-only
  primary_metric: GTVp Dice
  secondary_metrics:
    - Surface Dice (3 mm tolerance)
    - per-organ Dice (exploratory)

# ---------------------------------------------------------------------------
# Path templates (replace on server; copy to configs/local.yaml)
# ---------------------------------------------------------------------------
path_templates:
  repo_root: /path/to/radcure-medical-imaging
  organ_dictionary: /path/to/radcure_dictionary.json
  radcure_dataset_366: /path/to/work/nnunet_retrain_radcure366/Dataset366_TotalSegmentator
  radheck_dataset_650: /path/to/work/nnunet_radheck_test_1/Dataset650_TotalSegmentator
  hecktor_test_152: /path/to/work/nnunet_hecktor_test1/Dataset152_TotalSegmentator
  retrain_radcure_366: /path/to/work/nnunet_retrain_radcure366
  retrain_radheck_test2: /path/to/work/nnunet_radheck_test_1_retrain
  retrain_radheck_test3: /path/to/work/nnunet_radheck_test_3_retrain

# ---------------------------------------------------------------------------
# Test pools (what “evaluate on RADCURE / HECKTOR” means)
# ---------------------------------------------------------------------------
evaluation:
  radcure_test:
    description: Held-out RADCURE cases from Dataset366 splits (copied into combined Dataset650 imagesTs)
    images: "{radheck_dataset_650}/imagesTs"
    labels: "{radheck_dataset_650}/labelsTs"
    n_cases: 74
  hecktor_test:
    description: Held-out HECKTOR test set (Dataset152); never in RADHECK training
    images: "{hecktor_test_152}/imagesTs"
    labels: "{hecktor_test_152}/labelsTs"
    n_cases: 48

# ---------------------------------------------------------------------------
# Experiments
# ---------------------------------------------------------------------------
experiments:
  test1:
    id: test1
    name: RADCURE-only baseline
    status: completed
    config_file: configs/test1_radcure_only.yaml
    hypothesis: Baseline nnUNet trained only on RADCURE (366) generalises poorly to HECKTOR.
    training:
      cohorts: [radcure]
      dataset_id: 366
      dataset_folder_key: radcure_dataset_366
      nnunet_retrain_path_key: retrain_radcure_366
      trainer: nnUNetTrainerNoMirroring
      epochs: 1000
      configuration: 3d_fullres
    evaluation:
      model_dataset_id: 366
    results:
      primary_metric: GTVp Dice
      radcure:
        mean_dice: 0.377
        n_cases: 74
      hecktor:
        mean_dice: 0.330
        n_cases: 48
    notes: |
      Train exclusively on RADCURE-366. Evaluate on RADCURE test (366/650 Ts) and HECKTOR test (152).
      Source: research_notebooks/retrain_epoch_study/retrain_epoch_study.md

  test2:
    id: test2
    name: RADHECK combined — 1000 epochs
    status: completed
    config_file: configs/test2_radheck_1000epochs.yaml
    hypothesis: Adding HECKTOR training cases improves HECKTOR test GTVp Dice without hurting RADCURE much.
    training:
      cohorts: [radcure, hecktor]
      dataset_id: 650
      dataset_folder_key: radheck_dataset_650
      nnunet_retrain_path_key: retrain_radheck_test2
      trainer: nnUNetTrainerNoMirroring
      epochs: 1000
      configuration: 3d_fullres
      build_script: pipelines/radheck/build_nnunet_dataset.py
    evaluation:
      model_dataset_id: 650
      hecktor_eval_output_subdir: null  # default under Dataset152 unless set
    results:
      primary_metric: GTVp Dice
      radcure:
        mean_dice: 0.383
        n_cases: 74
      hecktor:
        mean_dice: 0.486
        n_cases: 48
    notes: |
      Combined Dataset650 (RADCURE-366 splits + HECKTOR train/val). Same preprocessing as Test3.
      Also documented in pipelines/radheck/Retrain-Radheck-Test2.md (multi-organ summary).

  test3:
    id: test3
    name: RADHECK combined — 700 epochs
    status: completed
    config_file: configs/test3_radheck_700epochs.yaml
    hypothesis: Reducing training from 1000 to 700 epochs reduces overfitting; improves HECKTOR, stable on RADCURE.
    training:
      cohorts: [radcure, hecktor]
      dataset_id: 650
      dataset_folder_key: radheck_dataset_650
      nnunet_retrain_path_key: retrain_radheck_test3
      nnunet_preprocessed_path_key: retrain_radheck_test2  # reuse Test2 preprocess
      trainer: nnUNetTrainer_700epochs_NoMirroring
      epochs: 700
      configuration: 3d_fullres
      custom_trainer_install: python -m nnunet_training.install_trainer_variants
    evaluation:
      model_dataset_id: 650
      hecktor_eval_output_subdir: hecktor_validation
    results:
      primary_metric: GTVp Dice
      radcure:
        mean_dice: 0.383
        n_cases: 74
      hecktor:
        mean_dice: 0.545
        n_cases: 48
    notes: |
      Reuses nnUNet_preprocessed from Test2; separate nnUNet_results under test_3_retrain.
      HECKTOR eval outputs can go to {retrain_radheck_test3}/hecktor_validation.
      Source: pipelines/radheck/Retrain-Radheck-Test3.md

  test4:
    id: test4
    name: RADHECK combined — separate GTVp / GTVn
    status: completed
    config_file: configs/test4_radheck_separate_gtvp_gtvn.yaml
    changed_from: test3
    hypothesis: >
      Separate GTVp and GTVn labels reduce spurious second-tumour predictions
      and allow per-target Dice (GTVp vs GTVn) vs merging both into one GTVp.
    training:
      cohorts: [radcure, hecktor]
      dataset_id: 650
      tumor_label_mode: separate
      trainer: nnUNetTrainer_700epochs_NoMirroring
      epochs: 700
      configuration: 3d_fullres
      build_script: pipelines/test4/build_dataset650.py
      retrain_runbook: pipelines/radheck/Retrain-Radheck-Test4.md
      preprocessing_notebook: research_notebooks/test4_gtvp_gtvn/test4_preprocessing_preview.ipynb
    evaluation:
      model_dataset_id: 650
      metrics: [GTVp Dice, GTVn Dice]
      hecktor_eval_output_subdir: hecktor_validation
    results:
      primary_metric: GTVp Dice
      secondary_metrics: [GTVn Dice]
      radcure:
        mean_dice_gtvp: 0.58
        mean_dice_gtvn: 0.60
        n_cases: 74
      hecktor:
        mean_dice_gtvp: null  # see TEST4_RESULTS.md + spreadsheet (worse than Test 2/3)
        mean_dice_gtvn: null
        n_cases: 48
    notes: |
      Phase 1 (done): preprocessing with tumor_label_mode=separate — preview notebook.
      Phase 2 (done): python -m pipelines.test4.relabel_tumor_batch → work/retrain_test4
        (reuse total_segmentator_output; new GTVp/GTVn labels).
      Phase 3 (done): build Dataset650 + train 700 epochs; same Tr/Va/Ts splits as Test3.
      Results write-up: research_notebooks/test4_gtvp_gtvn/TEST4_RESULTS.md

  test5:
    id: test5
    name: RADHECK — improved preprocess + max-train (fixed Ts) vs Test4
    status: planned
    config_file: configs/test5_radheck_improved_preprocess.yaml
    changed_from: test4
    hypothesis: >
      Improved anatomical background, separate GTVp/GTVn, canonical organ dict,
      and training on all ready cases except the fixed 74 Ts (and HECKTOR
      Dataset152) improve Dice vs Test4 on the same RADCURE test set.
    training:
      cohorts: [radcure, hecktor]
      dataset_id: 650
      tumor_label_mode: separate
      background_mode: improved
      anatomy_qc_threshold: null
      train_all_except_ts: true
      trainer: nnUNetTrainer_700epochs_NoMirroring
      epochs: 700
      configuration: 3d_fullres
      build_script: pipelines/test5/build_datasets.py
      retrain_runbook: pipelines/radheck/Retrain-Radheck-Test5.md
      preprocessing_notebook: research_notebooks/preprocessing_pipeline_review/preprocessing_pipeline_review_colab.ipynb
    evaluation:
      model_dataset_id: 650
      metrics: [GTVp Dice, GTVn Dice]
      hecktor_eval_output_subdir: hecktor_validation
    results:
      primary_metric: GTVp Dice
      secondary_metrics: [GTVn Dice]
      radcure:
        mean_dice_gtvp: null
        mean_dice_gtvn: null
        n_cases: null
      hecktor:
        mean_dice_gtvp: null
        mean_dice_gtvn: null
        n_cases: null
    notes: |
      Clean work root → transform into RADHECK_{N}/cases/ →
      build Dataset650+152 with --train-all-except-ts (default) →
      train 700 epochs NoMirroring → dual-cohort eval.
      Phase 2: python -m pipelines.test5.transform_cases
      Phase 3: python -m pipelines.test5.build_datasets
      (--manifest-splits restores old Tr≈361 if needed)

  test6:
    id: test6
    name: RADHECK — STU-Net fine-tune (GTVp/GTVn) vs Test5
    status: planned
    config_file: configs/test6_radheck_stunet_finetune.yaml
    changed_from: test5
    hypothesis: >
      Fine-tuning TotalSegmentator-pretrained STU-Net on the same Test5 Dataset650
      (separate GTVp/GTVn, unified Tr/Ts) improves GTVp/GTVn Dice vs Test5 nnUNet
      by transferring large-scale anatomical priors. No TotalSegmentator reprocess.
    training:
      cohorts: [radcure, hecktor]
      dataset_id: 650
      tumor_label_mode: separate
      model: STU-Net-S
      trainer: STUNetTrainer_small_ft
      epochs: 1000
      configuration: 3d_fullres
      reuse_test5_dataset650: true
      setup_script: pipelines/test6/setup_stunet.py
      train_script: pipelines/test6/train_finetune.py
      retrain_runbook: pipelines/radheck/Retrain-Radheck-Test6.md
      research_notebook: research_notebooks/test6_stunet/test6_stunet_inference_explore.ipynb
    evaluation:
      model_dataset_id: 650
      metrics: [GTVp Dice, GTVn Dice]
      unified_ts: true
    results:
      primary_metric: GTVp Dice
      secondary_metrics: [GTVn Dice]
      radcure:
        mean_dice_gtvp: null
        mean_dice_gtvn: null
        n_cases: null
      hecktor:
        mean_dice_gtvp: null
        mean_dice_gtvn: null
        n_cases: null
    notes: |
      Inference explore (prior): configs/test6_stunet_inference_explore.yaml (explored).
      Fine-tune path: setup_stunet → link_test5_dataset → train_finetune → evaluate.
      Dataset650 symlink from Test5; no TS reprocess.

  test7:
    id: test7
    name: RADHECK — probability outputs + region-vs-GTVp curves vs Test5
    status: planned
    config_file: configs/test7_radheck_probability_outputs.yaml
    changed_from: test5
    hypothesis: >
      If P(GTVp) ≥ 0.80 for a voxel — even when another class has higher
      probability — the voxel can still be treated as GTVp. Soft outputs and
      region-vs-GTVp probability curves quantify that rule better than hard Dice.
    training:
      cohorts: [radcure, hecktor]
      dataset_id: 650
      tumor_label_mode: separate
      reuse_test5_dataset650: true
      reuse_test5_model: true
      reuse_test6_splits: true  # Test6 Tr/Va/Ts = Test5 Dataset650 membership
      needs_train: false
      trainer: nnUNetTrainer_700epochs_NoMirroring
      epochs: 700
      configuration: 3d_fullres
      setup_script: pipelines/test7/link_dataset.py
      predict_script: pipelines/test7/predict_probabilities.py
      retrain_runbook: pipelines/radheck/Retrain-Radheck-Test7.md
    evaluation:
      model_dataset_id: 650
      primary_analysis: region_tumor_probabilities_vs_dice_curves
      metrics:
        - region_vs_GTVp probability curves
        - P(GTVp)>=0.80 hypothesis
      visualization: probability_visualisation
      unified_ts: true
    results:
      primary_metric: region_tumor_probabilities_vs_dice_curves
      radcure:
        n_cases: null
      hecktor:
        n_cases: null
    notes: |
      No reprocess / no retrain. Clean-link Test5 Dataset650 (same split as Test6).
      Predict with Test5 nnUNet + save_probabilities → slim crop (.slim.npz,
      float16, tumor ROI) → curves + alpha viz. Raw .npz deleted after slim.
      Hard Dice is not the primary metric.

